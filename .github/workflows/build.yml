name: Build and Release ApexPad Executables

on:
    push:
        # Triggers the workflow automatically when you push a version tag (e.g., v1.1.0)
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write # Required for GitHub Actions to create a release

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pyserial pystray pillow pyinstaller

            - name: Build Executable
              run: |
                  cd host-listener
                  # Appends the OS name automatically so files are distinct
                  pyinstaller --noconsole --onefile --name ApexPad-${{ runner.os }} main.py

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ApexPad-Binary-${{ matrix.os }}
                  path: host-listener/dist/*

    release:
        name: Create GitHub Release
        needs: build # Waits for all 3 OS builds to finish successfully
        runs-on: ubuntu-latest
        # Only run this step if a tag was pushed (prevents accidental releases on manual runs)
        if: startsWith(github.ref, 'refs/tags/')

        steps:
            - name: Download all OS Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts
                  merge-multiple: true # Flattens all OS binaries into a single folder

            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  files: release-artifacts/*
                  body_path: release_notes.md
